name: Build Wii U Aroma Plugin

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build . -t splat-wps-builder

      - name: Compile plugin
        run: docker run --rm -v "${PWD}:/project" splat-wps-builder make

      - name: Verify .wps
        run: |
          ls -la SplatWeaponChanger.wps
          test -s SplatWeaponChanger.wps

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: splat-weapon-changer-wps
          path: SplatWeaponChanger.wps
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: splat-weapon-changer-wps
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/SplatWeaponChanger.wps
          generate_release_notes: true
          draft: false
          prerelease: false
